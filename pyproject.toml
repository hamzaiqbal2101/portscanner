[project]
name = "portscanner"
version = "1.0.0"
description = "A pure-Python port scanner for network security analysis"
requires-python = ">=3.8"

[project.scripts]
portscanner = "portscanner.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["portscanner"]